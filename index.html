<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocab & Image Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>📸 English Vocabulary Memory Game</h1>
        <p class="description">Lật 1 thẻ HÌNH ẢNH và 1 thẻ CHỮ TIẾNG ANH tương ứng để ghi điểm!</p>
        
        <div class="score-board">
            <div class="score-box">Điểm: <span id="score">0</span></div>
            <div class="score-box">Lượt lật: <span id="flips">0</span></div>
            <button id="reset-btn">Chơi Lại</button>
        </div>

        <div class="game-grid" id="game-grid">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
